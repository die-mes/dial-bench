<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Dial Bench</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121212">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:200 800;font-style:normal;font-display:swap;src:url(ui-fonts/ahn-normal.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible Next';font-weight:200 800;font-style:italic;font-display:swap;src:url(ui-fonts/ahn-italic.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible Mono';font-weight:200 800;font-style:normal;font-display:swap;src:url(ui-fonts/ahm-normal.woff2) format('woff2')}
/* Layout: phone first. Header, step bar, dial canvas, and a bottom sheet you can drag between small, half and full. Desktop: canvas left, steps and controls right. */
:root{
  --bg:#f3f3f2; --surface:#ffffff; --sunk:#e8e8e6; --fg:#1b1b1a; --muted:#5f5f5c; --line:#d4d4d1;
  --accent:#1b1b1a; --on-accent:#ffffff; --sel:#e08a1e; --guide:#3e7d88; --warn:#b4432c; --stage:#e3e3e1;
  --ui:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --sheet-h:46vh;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --surface:#1c1c1b; --sunk:#0c0c0c; --fg:#ededeb; --muted:#9c9c99; --line:#30302e;
  --accent:#ededeb; --on-accent:#121212; --sel:#f0a33c; --guide:#6fb2bc; --warn:#ff7f66; --stage:#0a0a0a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1c1c1b; --sunk:#0c0c0c; --fg:#ededeb; --muted:#9c9c99; --line:#30302e;
  --accent:#ededeb; --on-accent:#121212; --sel:#f0a33c; --guide:#6fb2bc; --warn:#ff7f66; --stage:#0a0a0a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.app{height:100%;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bar{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px 4px}
.spacer{flex:1}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px 0 12px;height:44px;font:700 15px/1 var(--ui);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;max-width:42vw;display:inline-flex;align-items:center;gap:6px}
.chip::after{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-2px) rotate(45deg)}
.ib{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.ib:disabled{opacity:.35}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#moreB svg{fill:currentColor;stroke:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;font-weight:700;min-height:48px}
.btn.primary,.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn:disabled{opacity:.45}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:0 13px;min-height:44px;font-weight:600;font-size:15px}
.bar .seg{flex-wrap:nowrap;flex:none}.bar .seg button{padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.steps{flex:none;display:flex;padding:0 6px 4px}
.steps button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;padding:3px 0;font:600 11.5px/1.1 var(--ui);color:var(--muted);position:relative}
.steps button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps b{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:700 13px/1 var(--ui);background:var(--surface)}
.steps button[aria-current="step"]{color:var(--fg)}
.steps button[aria-current="step"] b{background:var(--fg);color:var(--bg);border-color:var(--fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--sel) 45%,transparent)}
.steps .bdg{position:absolute;top:0;left:calc(50% + 6px);min-width:19px;height:19px;border-radius:10px;padding:0 5px;font:700 11px/19px var(--ui);color:#fff;background:var(--warn);text-align:center}
.steps .bdg.ok{background:var(--guide)}
.stage{position:relative;flex:1 1 auto;min-height:72px;margin:0 10px;border-radius:16px;background:var(--stage);overflow:hidden;border:1px solid var(--line)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none}
.ov{position:absolute;display:flex;flex-direction:column;gap:6px;top:8px}
.ov.tl{left:8px}.ov.tr{right:8px}
.ov button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);display:grid;place-items:center;font:700 17px/1 var(--mono);color:var(--fg);padding:0}
.ov button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ov svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hud{position:absolute;left:60px;right:60px;bottom:8px;font:500 12.5px/1.3 var(--mono);color:var(--fg);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:10px;padding:6px 9px;pointer-events:none;font-variant-numeric:tabular-nums;text-align:center}
.hud:empty{display:none}
.splbar{position:absolute;left:8px;right:8px;bottom:48px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.splbar button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;font-weight:600;min-height:44px}
.panel{flex:none;height:var(--sheet-h);display:flex;flex-direction:column;background:var(--bg);border-top:1px solid var(--line);border-radius:20px 20px 0 0;margin-top:8px;box-shadow:0 -6px 22px rgb(0 0 0 / .10);transition:height .2s ease;min-height:0}
.panel.drag{transition:none}
.grab{flex:none;height:20px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab::before{content:"";width:44px;height:5px;border-radius:3px;background:var(--line)}
.phead{flex:none;display:flex;align-items:center;gap:8px;padding:0 16px 8px;touch-action:none;min-height:40px}
.phead h2{flex:1;min-width:0;margin:0;font:700 19px/1.15 var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phead small{font:600 12px var(--ui);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;flex:none}
.etabs{flex:none;padding:0 16px 8px;display:flex}
.etabs .seg{width:100%;flex-wrap:nowrap}
.etabs .seg button{flex:1;padding:0 4px}
#pb{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 16px 14px;overscroll-behavior:contain}
.pfoot{flex:none;display:flex;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.pfoot .btn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfoot .btn.warn{color:var(--warn);flex:0 0 auto}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:600 12.5px/1.1 var(--ui);padding:6px 2px;text-align:center}
.tile svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile.big{grid-column:span 2;flex-direction:row;min-height:60px;font-size:15px;gap:10px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font:700 10.5px/1 var(--ui);letter-spacing:.04em;text-transform:uppercase;padding:4px 6px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.lu{background:color-mix(in srgb,#6fd36a 22%,transparent);color:#2f7a2b}
.tag.pa{background:color-mix(in srgb,var(--sel) 22%,transparent);color:#8a5410}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
details.fold{border-bottom:1px solid var(--line)}
details.fold>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:52px;cursor:pointer;font:700 13px/1.2 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(-135deg)}
details.fold>summary em{font:500 12.5px var(--mono);letter-spacing:0;text-transform:none;color:var(--muted);font-style:normal;margin-left:4px}
details.fold>.sec{border-bottom:0;padding-top:0}
details.fold>.sec>h3{display:none}
details.fold>.sec+.sec>h3{display:block}
.hcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hcard{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px 8px;display:grid;justify-items:center;gap:2px;font:600 12.5px var(--ui)}
.hcard svg{width:100%;height:64px}
.hcard[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg),inset 0 -4px 0 var(--sel)}
.lead{margin:2px 0 0;font-size:14.5px;color:var(--muted)}
.sec{padding:12px 0 10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.sec:last-child{border-bottom:0}
.sec>*,.list>*,#sheetB>*,.flist>*{min-width:0}
.sec h3{margin:0 0 2px;font:700 13px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(84px,34%) 1fr 28px;align-items:center;gap:8px;min-height:48px}
.row>span:first-child{font-size:15px;color:var(--fg);line-height:1.25}
.row input[type=text],.row input[type=search],.row input[type=email],.row input[type=tel],.row input[type=url],.row input[type=date],.row input[type=time],.row select{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;font-size:16px}
.row input[inputmode=decimal]{font:500 16px var(--mono);font-variant-numeric:tabular-nums;text-align:center}
.row input[type=checkbox]{width:26px;height:26px;accent-color:var(--fg);justify-self:start}
input[type=color]{width:52px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px}
.stp{display:flex;gap:4px;min-width:0}
.stp input{flex:1;min-width:0}
.stp button{flex:none;width:40px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);font:600 20px/1 var(--ui);padding:0;color:var(--fg)}
.un{font:500 13px var(--mono);color:var(--muted)}
.row .seg{justify-self:start}
.ohead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:14px}
.ohead h2{margin:0;font:700 22px/1.15 var(--ui);flex:1;min-width:120px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;padding:0 14px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.mini.warn{color:var(--warn)}
a.mini{text-decoration:none;color:var(--fg)}
.muted{color:var(--muted)}
.empty{padding:18px 0;display:grid;gap:6px}
.empty p{margin:0;max-width:60ch}
.list{display:grid;gap:6px}
.li{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px 4px 4px 12px;min-height:52px}
.li.on{border-color:var(--fg);box-shadow:inset 4px 0 0 var(--sel)}
.li .nm{flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px 0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .nm small{font:500 12px var(--mono);color:var(--muted);margin-left:6px}
.nm.wrap{white-space:normal;line-height:1.35;font-weight:500}
.li button.sq{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:none;display:grid;place-items:center;font-size:15px;flex:none}
.li button.sq[aria-pressed="false"]{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:grid;gap:3px;min-height:76px}
.card b{font:700 17px/1.1 var(--ui)}
.card small{color:var(--muted);font-size:12.5px}
.card[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg),inset 0 -4px 0 var(--sel)}
.spec{width:100%;border-collapse:collapse;font-size:14px}
.spec td{padding:7px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.spec td:last-child{text-align:right;font:500 13px/1.35 var(--mono);font-variant-numeric:tabular-nums}
.src{font-size:12.5px;color:var(--muted)}
.badge{display:inline-block;font:700 11px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;padding:5px 7px;border-radius:6px;background:color-mix(in srgb,var(--guide) 16%,transparent);color:var(--guide)}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swb{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);font:700 12px var(--ui);color:#777;padding:0}
.swb.on{outline:3px solid var(--sel);outline-offset:2px}
.pill{font:700 11px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-radius:6px;flex:none}
.pill.err{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.warn{background:color-mix(in srgb,#d9a400 24%,transparent);color:#9a7300}
.ok{margin:0;color:var(--guide);font-weight:600}
.sheet{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 50%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--bg);width:min(640px,100%);max-height:90vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border:1px solid var(--line)}
.sheet-card::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-bottom:8px}
.sheet-head{display:flex;align-items:center;gap:8px;padding-bottom:8px}
.sheet-head h2{flex:1;margin:0;font:700 21px/1.1 var(--ui)}
#sheetB{overflow-y:auto;display:grid;gap:10px;align-content:start;padding-bottom:8px}
#sheetB input[type=search]{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font-size:16px}
.flist{display:grid;gap:6px}
.flist h4{margin:10px 0 2px;font:700 13px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fitem{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;text-align:left;min-height:52px}
.fitem small{color:var(--muted);font-size:12.5px}
.fitem[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 4px 0 0 var(--sel)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.icell{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 4px;display:grid;justify-items:center;gap:4px;min-height:84px}
.icell .g{font-size:32px;line-height:1;height:34px;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";overflow:hidden;max-width:100%}
.icell .g.pend{font-size:11px;color:var(--muted);height:auto}
.icell small{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xrow{display:grid;gap:4px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;text-align:left;min-height:64px}
.xrow b{font:700 17px/1.15 var(--ui)}
.xrow small{color:var(--muted);font-size:13.5px}
.xrow.primary b,.xrow.primary small{color:var(--on-accent)}
.ta{width:100%;min-height:260px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;font:14px/1.5 var(--mono);color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 118px);z-index:60;background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;max-width:min(92vw,520px);box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.banner{background:color-mix(in srgb,var(--warn) 15%,var(--surface));border:1px solid var(--warn);border-radius:12px;padding:12px;margin-top:8px}
@media (min-width:960px){
  .app{display:grid;grid-template-columns:1fr 440px;grid-template-rows:auto auto 1fr;column-gap:14px;padding-right:14px}
  .bar{grid-column:1 / -1}
  .steps{grid-column:2;grid-row:2}
  .stage{grid-column:1;grid-row:2 / 4;margin:0 0 14px 14px}
  .panel{grid-column:2;grid-row:3;height:auto!important;margin:0 0 14px;border:1px solid var(--line);border-radius:16px;box-shadow:none;overflow:hidden}
  .grab{display:none}
  .phead{padding-top:12px}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
@media (prefers-reduced-motion:no-preference){.tile,.seg button,.card{transition:background-color .15s,color .15s,border-color .15s}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <button class="chip" id="mvChip" type="button" title="Switch design">Dial</button>
    <div class="spacer"></div>
    <button class="ib" id="undoB" type="button" aria-label="Undo" title="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="ib" id="redoB" type="button" aria-label="Redo" title="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <div class="seg" id="unitSeg" role="group" aria-label="Units">
      <button type="button" data-u="in" aria-pressed="true">in</button><button type="button" data-u="mm" aria-pressed="false">mm</button>
    </div>
    <button class="ib" id="moreB" type="button" aria-label="More" title="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
  </header>
  <nav class="steps" id="steps" aria-label="Steps"></nav>
  <section class="stage" id="stage" aria-label="Dial canvas">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dial design">
      <defs>
        <pattern id="hatch" width="0.35" height="0.35" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="0.35" style="stroke:var(--warn)" stroke-width="0.06"></line>
        </pattern>
        <pattern id="hatchG" width="0.6" height="0.6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
          <line x1="0" y1="0" x2="0" y2="0.6" style="stroke:var(--guide)" stroke-width="0.05"></line>
        </pattern>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="0.22" result="b"></feGaussianBlur>
          <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
        </filter>
        <filter id="hsh" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0.18" dy="0.3" stdDeviation="0.18" flood-color="#000" flood-opacity="0.45"></feDropShadow>
        </filter>
      </defs>
      <g id="gCase" pointer-events="none"></g><g id="gDial"></g><g id="gObj"></g><g id="gGuide" pointer-events="none"></g><g id="gPrev" pointer-events="none"></g><g id="gSel" pointer-events="none"></g><g id="gTmp" pointer-events="none"></g>
    </svg>
    <div class="ov tl">
      <button id="handB" type="button" aria-label="Hands and case preview" aria-pressed="false" title="Hands and case preview"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/><path d="M9 5.8 9.6 2h4.8l.6 3.8M9 18.2l.6 3.8h4.8l.6-3.8M12 12V8.6M12 12l2.4 1.4"/></svg></button>
      <button id="lumeB" type="button" aria-label="Lume view" aria-pressed="false" title="Lume view"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      <button id="gBtn" type="button" aria-label="Two-finger gestures" style="font-size:11px">OBJ</button>
    </div>
    <div class="ov tr">
      <button id="zIn" type="button" aria-label="Zoom in">+</button>
      <button id="zOut" type="button" aria-label="Zoom out">−</button>
      <button id="zFit" type="button" aria-label="Fit design" style="font-size:12px">FIT</button>
    </div>
    <div class="splbar" id="splBar" hidden>
      <button type="button" data-a="undo">Undo point</button>
      <button type="button" data-a="open">Finish open</button>
      <button type="button" data-a="close" class="primary">Close shape</button>
      <button type="button" data-a="cancel">Cancel</button>
    </div>
    <div class="hud" id="hud" aria-live="polite"></div>
  </section>
  <section class="panel" id="panel" aria-label="Controls">
    <div class="grab" id="grab" aria-hidden="true"></div>
    <div class="phead" id="phead"><h2 id="pTitle">Movement</h2></div>
    <div class="etabs" id="etabs" hidden></div>
    <div id="pb"></div>
    <div class="pfoot" id="pfoot"></div>
  </section>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <div class="sheet-head"><h2 id="sheetT">Sheet</h2><button class="mini" id="sheetX" type="button">Done</button></div>
    <div id="sheetB"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="fileIn" hidden>
<script src="clipper.js"></script>
<script src="app.js"></script>
</body>
</html>
